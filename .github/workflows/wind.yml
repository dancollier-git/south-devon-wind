name: Record and publish wind
on:
  schedule:
    - cron: '17 * * * *' # Prawle observation hourly
    - cron: '43 2 * * *' # Extra recovery before the UK report, including during BST
    - cron: '30 3 * * *' # Final dedicated pre-report retry
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/wind.yml'
      - 'docs/index.html'
permissions: {}
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      allowed: ${{ steps.command.outputs.allowed }}
    steps:
      - name: Authorize event
        id: command
        shell: bash
        run: |
          python3 - <<'PYAUTH'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          name = os.environ['GITHUB_EVENT_NAME']
          allowed = name in ('schedule', 'workflow_dispatch', 'push')
          if name == 'issue_comment':
              issue = event.get('issue', {})
              comment = event.get('comment', {})
              allowed = (
                  event.get('action') == 'created'
                  and issue.get('number') == 1
                  and 'pull_request' not in issue
                  and comment.get('body') == '/wind'
                  and comment.get('user', {}).get('login') == 'dancollier-git'
                  and event.get('repository', {}).get('owner', {}).get('login') == 'dancollier-git'
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('allowed=' + str(allowed).lower() + '\n')
          PYAUTH
  publish:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: wind-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch one NCI reading
        id: reading
        continue-on-error: true
        run: python record.py
      - name: Check whether today's daily forecast is missing
        id: daily_due
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(timezone.utc)
          london = ZoneInfo('Europe/London')
          local_now = now.astimezone(london)
          stamps = []
          for filename, field in (('docs/forecast.json', 'retrieved_at'),
                                  ('docs/assessments.json', 'generated_at')):
              try:
                  data = json.loads(Path(filename).read_text())
                  stamp = datetime.fromisoformat(data[field].replace('Z', '+00:00'))
                  if stamp.tzinfo is None or stamp > now:
                      stamp = None
              except (OSError, AttributeError, ValueError, KeyError, TypeError):
                  stamp = None
              stamps.append(stamp)

          today = local_now.date()
          current = (stamps[0] is not None and stamps[0] == stamps[1]
                     and stamps[0].astimezone(london).date() == today)
          # Any hourly run from 00:17 UK time can recover a missed collection.
          # Check against the actual local date even if GitHub delays the job.
          required = (os.environ['GITHUB_EVENT_NAME'] != 'schedule'
                      or local_now.hour > 0 or local_now.minute >= 17)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'collect={str(required and not current).lower()}', file=output)
              print(f'verify={str(required).lower()}', file=output)
          print(f'Daily forecast date={today}; current={current}; forecast required={required}')
          PY
      - name: Collect and archive forecasts (daily only)
        id: forecast
        if: steps.daily_due.outputs.collect == 'true'
        continue-on-error: true
        run: python forecast.py
      - name: Record observation or failure
        run: |
          test -f docs/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/latest.json docs/history.json docs/forecast.json docs/assessments.json docs/accuracy.json archive/forecasts
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Prawle observations and South Devon forecasts'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy JSON to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published forecast JSON
        id: publication
        if: steps.daily_due.outputs.verify == 'true'
        continue-on-error: true
        run: python publication_check.py
      - name: Report source health
        env:
          FORECAST_REQUIRED: ${{ steps.daily_due.outputs.verify }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          FORECAST_OUTCOME: ${{ steps.forecast.outcome }}
          READING_OUTCOME: ${{ steps.reading.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('docs/latest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Prawle Point source check\n\n```json\n' + json.dumps(data, indent=2) + '\n```\n')
              forecasts = json.loads(Path('docs/forecast.json').read_text())
              summary.write('## Forecast source checks\n\n')
              for source in forecasts['snapshots']:
                  summary.write(f"- {source['location']} {source['kind']}: {source['status']} {source.get('error', '')}\n")
          PY
          if [ "$FORECAST_REQUIRED" = true ]; then
            test "$PUBLICATION_OUTCOME" = success
            test "$FORECAST_OUTCOME" = success || test "$FORECAST_OUTCOME" = skipped
            python forecast_health.py
          fi
          test "$READING_OUTCOME" = success
