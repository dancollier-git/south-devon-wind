name: Record and publish wind
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - '.github/workflows/wind.yml'
      - 'docs/index.html'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: wind-publication
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch one NCI reading
        id: reading
        continue-on-error: true
        run: python record.py
      - name: Record observation or failure
        run: |
          test -f docs/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/latest.json docs/history.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Prawle Point wind observation'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy JSON to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report source health
        env:
          READING_OUTCOME: ${{ steps.reading.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('docs/latest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Prawle Point source check\n\n```json\n' + json.dumps(data, indent=2) + '\n```\n')
          PY
          test "$READING_OUTCOME" = success
