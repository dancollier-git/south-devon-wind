name: Record and publish wind
on:
  schedule:
    - cron: '17 * * * *' # Prawle observation hourly
    - cron: '30 3 * * *' # Daily forecast 03:30 UTC (03:30 GMT / 04:30 BST)
  workflow_dispatch:
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths:
      - '*.py'
      - 'tests/**'
      - 'config/**'
      - '.github/workflows/wind.yml'
      - 'docs/index.html'
permissions: {}
jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      allowed: ${{ steps.command.outputs.allowed }}
    steps:
      - name: Authorize event
        id: command
        shell: bash
        run: |
          python3 - <<'PYAUTH'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          name = os.environ['GITHUB_EVENT_NAME']
          allowed = name in ('schedule', 'workflow_dispatch', 'push')
          if name == 'issue_comment':
              issue = event.get('issue', {})
              comment = event.get('comment', {})
              allowed = (
                  event.get('action') == 'created'
                  and issue.get('number') == 1
                  and 'pull_request' not in issue
                  and comment.get('body') == '/wind'
                  and comment.get('user', {}).get('login') == 'dancollier-git'
                  and event.get('repository', {}).get('owner', {}).get('login') == 'dancollier-git'
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('allowed=' + str(allowed).lower() + '\n')
          PYAUTH
  publish:
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    permissions:
      contents: write
      pages: write
      id-token: write
    concurrency:
      group: wind-publication
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline tests
        run: python -m unittest discover -s tests -v
      - name: Fetch one NCI reading
        id: reading
        continue-on-error: true
        run: python record.py
      - name: Check whether today's daily forecast is missing
        id: daily_due
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path

          today = datetime.now(timezone.utc).date()
          due = False
          for filename, field in (('docs/forecast.json', 'retrieved_at'),
                                  ('docs/assessments.json', 'generated_at')):
              try:
                  data = json.loads(Path(filename).read_text())
                  stamp = datetime.fromisoformat(data[field].replace('Z', '+00:00'))
                  if stamp.tzinfo is None or stamp.astimezone(timezone.utc).date() != today:
                      due = True
              except (OSError, ValueError, KeyError, TypeError):
                  due = True
          # Allow the normal 03:30 UTC run first; hourly 04:17+ is recovery.
          now = datetime.now(timezone.utc)
          scheduled_daily = os.environ.get('GITHUB_EVENT_NAME') == 'schedule' and os.environ.get('GITHUB_EVENT_SCHEDULE') == '30 3 * * *'
          recovery = now.hour >= 4 and due
          should_collect = scheduled_daily or recovery or os.environ.get('GITHUB_EVENT_NAME') != 'schedule'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'collect={str(should_collect).lower()}\\n')
          print(f'Daily forecast date={today}; missing={due}; collect={should_collect}')
          PY
      - name: Collect and archive forecasts (daily only)
        id: forecast
        if: steps.daily_due.outputs.collect == 'true'
        continue-on-error: true
        run: python forecast.py
      - name: Record observation or failure
        run: |
          test -f docs/latest.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/latest.json docs/history.json docs/forecast.json docs/assessments.json docs/accuracy.json archive/forecasts
          if ! git diff --cached --quiet; then
            git commit -m 'Archive Prawle observations and South Devon forecasts'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy JSON to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published forecast JSON
        id: publication
        if: steps.forecast.outcome != 'skipped'
        continue-on-error: true
        run: python publication_check.py
      - name: Report source health
        env:
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          FORECAST_OUTCOME: ${{ steps.forecast.outcome }}
          READING_OUTCOME: ${{ steps.reading.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('docs/latest.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('## Prawle Point source check\n\n```json\n' + json.dumps(data, indent=2) + '\n```\n')
              forecasts = json.loads(Path('docs/forecast.json').read_text())
              summary.write('## Forecast source checks\n\n')
              for source in forecasts['snapshots']:
                  summary.write(f"- {source['location']} {source['kind']}: {source['status']} {source.get('error', '')}\n")
          PY
          test "$READING_OUTCOME" = success
          if [ "$FORECAST_OUTCOME" != skipped ]; then
            test "$FORECAST_OUTCOME" = success
            python forecast_health.py
          fi
          if [ "$FORECAST_OUTCOME" != skipped ]; then
            test "$PUBLICATION_OUTCOME" = success
          fi
